<div style="padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; background-color: #f9f9f9;">
  <h2>Cadastrar Novo Livro</h2>

  <div style="margin-bottom: 12px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Título:</label>
    <input type="text" [(ngModel)]="novoLivro.titulo" placeholder="Digite o título do livro" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 12px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Autor:</label>
    <input type="text" [(ngModel)]="novoLivro.autor" placeholder="Digite o autor" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Ano:</label>
    <input type="number" [(ngModel)]="novoLivro.ano" placeholder="Ex: 2024" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>

  <button 
  (click)="salvar()" 
  [disabled]="!novoLivro.titulo" 
  style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
  Salvar Livro
</button>
</div>
